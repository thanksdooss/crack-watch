# Render 무료 서버는 15분간 요청이 없으면 잠들고, 다음 접속 때 깨는 데 1분쯤 걸린다.
# 주기적으로 헬스체크를 보내 깨워 둔다.
#
# 시간 예산 주의: Render 무료는 **워크스페이스당 월 750 인스턴스 시간**이다(서비스별이 아니다).
# 같은 계정에서 SKAVOCA API가 KST 08:00~24:00(월 약 480시간)을 이미 쓰고 있어,
# 여기서는 평일 낮 시간대만 깨운다 — KST 09:00~19:00 × 주 5일 ≈ 월 220시간.
# 합계 약 700시간으로 한도 안에 들어온다. 시간대를 넓히려면 SKAVOCA 쪽을 줄이거나
# Render 워크스페이스를 분리해야 한다.
#
# 준비: 저장소 Settings → Secrets and variables → Actions → Variables 에
#       이름 API_URL, 값 https://<서버주소>.onrender.com 을 등록한다. 없으면 이 작업은 그냥 넘어간다.
name: keep-warm

on:
  schedule:
    - cron: "*/14 0-10 * * 1-5" # UTC 00:00~10:59 월~금 = KST 09:00~19:59 평일
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 서버 깨우기 (주소가 등록되지 않았으면 건너뜀)
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL 변수가 없어 건너뜁니다. 배포 후 저장소 Variables에 등록하세요."
            exit 0
          fi
          curl -fsS --max-time 120 "$API_URL/health" || true
